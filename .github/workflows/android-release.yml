name: Android release

# Tag pushes build, sign and publish the release APK of the Kotlin client (apps/android).
# Pushes to main that touch the Android build run the same build without signing or publishing,
# only to fill the Gradle cache: GitHub lets a tag run read caches from the default branch, but a
# cache saved by one tag run is not visible to the next tag.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ANDROID_PLATFORM: android-37.0
  BUILD_TOOLS: 37.0.0
  APK: apps/android/app/build/outputs/apk/release/app-release.apk

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^app-version-name = "\(.*\)"$/\1/p' apps/android/gradle/libs.versions.toml)"
          if [ -z "$version" ] || [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app-version-name '$version' in apps/android/gradle/libs.versions.toml" >&2
            exit 1
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Written only on main (the action's default); tag builds read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - run: pnpm verify

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;$ANDROID_PLATFORM" "build-tools;$BUILD_TOOLS"

      - name: Host libsodium for Robolectric tests
        if: startsWith(github.ref, 'refs/tags/')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsodium23

      - name: Gradle verify
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/android
        run: ./gradlew verify

      - name: Warm the Gradle cache (main, unsigned, not published)
        if: github.ref == 'refs/heads/main'
        working-directory: apps/android
        run: ./gradlew :app:assembleRelease --build-cache

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$(mktemp)"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          log="$RUNNER_TEMP/gradle.log"
          set +e
          ./gradlew :app:assembleRelease --build-cache \
            -Pandroid.injected.signing.store.file="$keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ]; then
            summary="$(sed -n '/What went wrong:/,/\* Try:/p' "$log" | head -n 40)"
            [ -n "$summary" ] || summary="$(tail -n 40 "$log")"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Gradle build failed::$summary"
            exit "$status"
          fi

      - name: Check the signature is not the debug key
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          signer="$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep 'certificate DN')"
          echo "$signer"
          if printf '%s' "$signer" | grep -q 'CN=Android Debug'; then
            echo "The APK is signed with the debug key" >&2
            exit 1
          fi

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="kodakiko-${GITHUB_REF_NAME}.apk"
          mkdir -p release
          cp "$APK" "release/$name"
          (cd release && sha256sum "$name" > "$name.sha256")
          gh release create "$GITHUB_REF_NAME" release/* --title "Kodakiko $GITHUB_REF_NAME" --generate-notes
