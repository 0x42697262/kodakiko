services:
  postgres-test:
    image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: kodakiko_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d kodakiko_test']
      interval: 2s
      timeout: 3s
      retries: 30

  garage-test:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    command: ['/garage', 'server']
    volumes:
      - ./test/garage.toml:/etc/garage.toml:ro
    ports:
      - '127.0.0.1:53900:3900'
    tmpfs:
      - /var/lib/garage
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 2s
      timeout: 3s
      retries: 30
