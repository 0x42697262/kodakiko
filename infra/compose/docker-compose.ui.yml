name: kodakiko-ui

services:
  postgres-ui:
    image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    environment:
      POSTGRES_USER: kodakiko
      POSTGRES_PASSWORD: kodakiko
      POSTGRES_DB: kodakiko
    ports:
      - '127.0.0.1:55433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kodakiko']
      interval: 2s
      timeout: 3s
      retries: 30

  garage-ui:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    command: ['/garage', 'server']
    volumes:
      - ./ui/garage.toml:/etc/garage.toml:ro
    ports:
      - '127.0.0.1:9581:3900'
    tmpfs:
      - /var/lib/garage
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 2s
      timeout: 3s
      retries: 30

  caddy-ui:
    image: caddy:2@sha256:9c1b76fb701c1f77383d3124d9f626e38bcf83bc1255ed47475d4f2420701d03
    volumes:
      - ./ui/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../caddy/snippets:/etc/caddy/snippets:ro
      - ../../apps/client/dist:/srv/web:ro
    ports:
      - '127.0.0.1:9580:9580'
    environment:
      S3_PUBLIC_ORIGIN: http://localhost:9581
      CSP_SCRIPT_HASHES: ''
    extra_hosts:
      - 'host.docker.internal:host-gateway'
