appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    clearState: true
- runFlow: common/connect.yaml
- tapOn:
    id: signIn.username
- inputText: ${USERNAME}
- tapOn:
    id: signIn.password
- inputText: ${WRONG_PASSWORD}
- tapOn:
    id: signIn.submit
- extendedWaitUntil:
    visible:
      id: errors.invalidCredentials
      containsChild:
        text: Username or password is incorrect.
    timeout: 60000
- tapOn:
    id: signIn.username
- eraseText
- inputText: ${UNKNOWN_USERNAME}
- tapOn:
    id: signIn.password
- inputText: ${OTHER_PASSWORD}
- tapOn:
    id: signIn.submit
- extendedWaitUntil:
    visible:
      id: errors.invalidCredentials
      containsChild:
        text: Username or password is incorrect.
    timeout: 60000
- tapOn:
    id: signIn.username
- eraseText
- inputText: ${USERNAME}
- tapOn:
    id: signIn.password
- inputText: ${PASSWORD}
- tapOn:
    id: signIn.submit
- extendedWaitUntil:
    visible:
      id: home.signedInAs
      text: .*${USERNAME}.*
    timeout: 60000
