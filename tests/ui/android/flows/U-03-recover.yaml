appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    clearState: true
- runFlow: common/connect.yaml
- tapOn:
    id: signIn.forgot
- tapOn:
    id: recover.username
- inputText: ${USERNAME}
- tapOn:
    id: recover.words
- inputText: ${WORDS}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: recover.newPassword
- tapOn:
    id: recover.newPassword
- inputText: ${NEW_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: recover.confirm
- tapOn:
    id: recover.confirm
- inputText: ${NEW_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: recover.submit
- tapOn:
    id: recover.submit
- extendedWaitUntil:
    visible:
      id: home.signedInAs
      text: .*${USERNAME}.*
    timeout: 60000
- tapOn:
    id: gallery.more
- tapOn:
    id: home.signOut
- runFlow: common/connect.yaml
- tapOn:
    id: signIn.username
- inputText: ${USERNAME}
- tapOn:
    id: signIn.password
- inputText: ${OLD_PASSWORD}
- tapOn:
    id: signIn.submit
- extendedWaitUntil:
    visible:
      id: errors.invalidCredentials
    timeout: 60000
- tapOn:
    id: signIn.password
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: signIn.submit
- extendedWaitUntil:
    visible:
      id: home.signedInAs
      text: .*${USERNAME}.*
    timeout: 60000
