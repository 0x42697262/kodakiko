appId: com.x42697262.kodakiko
---
- launchApp:
    appId: com.x42697262.kodakiko
    clearState: true
- runFlow: common/connect.yaml
- tapOn:
    id: signIn.username
- inputText: ${USERNAME}
- tapOn:
    id: signIn.password
- inputText: ${PASSWORD}
- tapOn:
    id: signIn.submit
- extendedWaitUntil:
    visible:
      id: cancelDeletion.title
    timeout: 60000
- tapOn:
    id: cancelDeletion.submit
- extendedWaitUntil:
    visible:
      id: home.signedInAs
      text: .*${USERNAME}.*
    timeout: 60000
