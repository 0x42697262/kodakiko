appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    clearState: true
- runFlow: common/connect.yaml
- tapOn:
    id: signIn.username
- inputText: ${USERNAME}
- tapOn:
    id: signIn.password
- inputText: ${PASSWORD}
- tapOn:
    id: signIn.submit
- extendedWaitUntil:
    visible:
      id: cancelDeletion.title
    timeout: 60000
- tapOn:
    id: cancelDeletion.submit
- extendedWaitUntil:
    visible:
      id: (lock\.title|home\.signedInAs)
    timeout: 60000
- runFlow:
    when:
      visible:
        id: lock.title
    commands:
      - tapOn:
          id: lock.unlockPassword
      - tapOn:
          id: lock.password
      - inputText: ${PASSWORD}
      - pressKey: Enter
- extendedWaitUntil:
    visible:
      id: home.signedInAs
      text: .*${USERNAME}.*
    timeout: 60000
