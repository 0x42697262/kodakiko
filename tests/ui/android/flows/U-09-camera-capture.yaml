appId: com.x42697262.kodakiko
---
- launchApp:
    appId: com.x42697262.kodakiko
    clearState: true
- runFlow: common/connect.yaml
- runFlow: common/sign-in.yaml
- tapOn:
    id: gallery.capture
- extendedWaitUntil:
    visible:
      id: capture.shutter
    timeout: 30000
- tapOn:
    id: capture.shutter
- extendedWaitUntil:
    visible:
      id: capture.trayItem.0
    timeout: 30000
- longPressOn:
    id: capture.shutter
- extendedWaitUntil:
    visible:
      id: capture.trayItem.1
    timeout: 30000
- tapOn:
    id: capture.next
- extendedWaitUntil:
    visible:
      id: compose.screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: compose.save
- tapOn:
    id: compose.save
- extendedWaitUntil:
    visible:
      id: gallery.tile.0
    timeout: 60000
