appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    clearState: true
- runFlow: common/connect.yaml
- runFlow: common/sign-in.yaml
- tapOn:
    id: gallery.capture
- extendedWaitUntil:
    visible:
      id: capture.shutter
    timeout: 30000
- repeat:
    while:
      notVisible:
        id: capture.trayItem.0
    times: 6
    commands:
      - tapOn:
          id: capture.shutter
      - extendedWaitUntil:
          visible:
            id: capture.trayItem.0
          timeout: 10000
          optional: true
- extendedWaitUntil:
    visible:
      id: capture.trayItem.0
    timeout: 30000
- tapOn:
    id: capture.mode.video
- tapOn:
    id: capture.shutter
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: capture.shutter
- extendedWaitUntil:
    visible:
      id: capture.trayItem.1
    timeout: 30000
- tapOn:
    id: capture.next
- extendedWaitUntil:
    visible:
      id: compose.screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: compose.save
- tapOn:
    id: compose.save
- extendedWaitUntil:
    visible:
      id: gallery.tile.0
    timeout: 60000
