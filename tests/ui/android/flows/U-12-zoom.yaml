appId: com.x42697262.kodakiko
---
- launchApp:
    appId: com.x42697262.kodakiko
    clearState: true
- runFlow: common/connect.yaml
- runFlow: common/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: gallery.tile.0
    timeout: 60000
- tapOn:
    id: gallery.tile.0
- assertVisible:
    id: viewer.pageIndicator
    text: 1 / 2
- doubleTapOn:
    id: viewer.zoomable.0
- assertVisible: Photo 1, zoomed
- swipe:
    from:
      id: viewer.zoomable.0
    direction: LEFT
- assertVisible:
    id: viewer.pageIndicator
    text: 1 / 2
- doubleTapOn:
    id: viewer.zoomable.0
- assertVisible: Photo 1
- swipe:
    from:
      id: viewer.zoomable.0
    direction: LEFT
- assertVisible:
    id: viewer.pageIndicator
    text: 2 / 2
