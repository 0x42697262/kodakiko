appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    clearState: true
- runFlow: common/connect.yaml
- runFlow: common/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: gallery.tile.0
    timeout: 60000
- tapOn:
    id: gallery.tile.0
- assertVisible:
    id: viewer.pageIndicator
    text: 1 / 2
- doubleTapOn:
    id: viewer.zoomable.0
    delay: 250
- assertVisible: Photo 1, zoomed
- swipe:
    start: 90%, 40%
    end: 10%, 40%
- assertVisible:
    id: viewer.pageIndicator
    text: 1 / 2
- doubleTapOn:
    id: viewer.zoomable.0
    delay: 250
- assertVisible: Photo 1
- swipe:
    start: 90%, 40%
    end: 10%, 40%
- assertVisible:
    id: viewer.pageIndicator
    text: 2 / 2
