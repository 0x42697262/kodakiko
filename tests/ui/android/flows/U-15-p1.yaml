appId: com.x42697262.kodakiko
---
- launchApp:
    appId: com.x42697262.kodakiko
    clearState: true
- runFlow: common/connect.yaml
- runFlow: common/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: gallery.settings
    timeout: 60000
- tapOn:
    id: gallery.settings
- tapOn:
    id: settings.row.security
- tapOn:
    id: settings.autoLock.1
- pressKey: Home
