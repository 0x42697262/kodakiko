appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    clearState: true
- runFlow: common/connect.yaml
- runFlow: common/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: tabs.more
    timeout: 60000
- tapOn:
    id: tabs.more
- scrollUntilVisible:
    element:
      id: more.settings
    direction: DOWN
- tapOn:
    id: more.settings
- scrollUntilVisible:
    element:
      id: settings.row.security
    direction: DOWN
- tapOn:
    id: settings.row.security
- tapOn:
    id: settings.autoLock
- tapOn:
    id: settings.autoLock.1
- pressKey: Home
