appId: com.x42697262.kodakiko
---
- launchApp:
    appId: com.x42697262.kodakiko
    clearState: true
- runFlow: common/connect.yaml
- runFlow: common/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: tabs.more
    timeout: 60000
- tapOn:
    id: tabs.more
- tapOn:
    id: more.settings
- tapOn:
    id: settings.row.account
- tapOn:
    id: settings.changeServer
- tapOn:
    id: settings.changeServerConfirm
- extendedWaitUntil:
    visible:
      id: welcome.serverLabel
    timeout: 30000
- assertVisible:
    id: welcome.serverLabel
    text: ''
