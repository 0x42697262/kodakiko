appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    clearState: true
- runFlow: common/connect.yaml
- runFlow: common/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: tabs.more
    timeout: 60000
- tapOn:
    id: tabs.more
- scrollUntilVisible:
    element:
      id: more.settings
    direction: DOWN
- tapOn:
    id: more.settings
- scrollUntilVisible:
    element:
      id: settings.row.account
    direction: DOWN
- tapOn:
    id: settings.row.account
- tapOn:
    id: settings.changeServer
- tapOn:
    id: settings.changeServerConfirm
- extendedWaitUntil:
    visible:
      id: welcome.serverLabel
    timeout: 30000
- assertVisible:
    id: welcome.serverLabel
    text: ''
