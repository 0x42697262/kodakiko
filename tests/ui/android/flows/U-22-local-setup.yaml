appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    clearState: true
- extendedWaitUntil:
    visible:
      id: welcome.local
    timeout: 180000
- tapOn:
    id: welcome.local
- tapOn:
    id: localSetup.understand
- tapOn:
    id: localSetup.username
- inputText: ${USERNAME}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: localSetup.password
- tapOn:
    id: localSetup.password
- inputText: ${PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: localSetup.confirm
- tapOn:
    id: localSetup.confirm
- inputText: ${PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: localSetup.create
- tapOn:
    id: localSetup.create
- extendedWaitUntil:
    visible:
      id: recoveryKey.word.1
    timeout: 60000
- runFlow: common/recovery-words.yaml
- tapOn:
    id: recoveryKey.confirmSubmit
- tapOn:
    id: gallery.capture
- extendedWaitUntil:
    visible:
      id: capture.shutter
    timeout: 30000
- repeat:
    while:
      notVisible:
        id: capture.trayItem.0
    times: 6
    commands:
      - tapOn:
          id: capture.shutter
      - extendedWaitUntil:
          visible:
            id: capture.trayItem.0
          timeout: 10000
          optional: true
- extendedWaitUntil:
    visible:
      id: capture.trayItem.0
    timeout: 30000
- tapOn:
    id: capture.next
- scrollUntilVisible:
    element:
      id: compose.save
- tapOn:
    id: compose.save
- extendedWaitUntil:
    visible:
      id: gallery.tile.0
    timeout: 60000
- assertVisible:
    id: gallery.tilePending.0
